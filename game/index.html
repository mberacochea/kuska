<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>achka</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <h1>achka</h1>

      <div class="controls">
        <select id="mode">
          <option value="two-player">Two Player</option>
          <option value="vs-computer">vs Computer</option>
        </select>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="reset">Reset</button>
      </div>

      <div id="status" aria-live="polite"></div>

      <div id="board" role="grid" aria-label="Tic-tac-toe game board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
      </div>

      <div id="scoreboard">
        <div>X: <span id="score-x">0</span></div>
        <div>O: <span id="score-o">0</span></div>
        <div>Draw: <span id="score-draw">0</span></div>
        <button id="reset-scores">Reset Scores</button>
      </div>
    </div>

    <script type="module" src="game.js"></script>
  </body>
</html>
