{% extends "layout.html" %}
{% block body %}
<h2>Docs <span class="muted">- shared project knowledge, read by agents through docs_get</span></h2>
{{ docs_table|safe }}
<form class="row-form" hx-post="/docs" hx-target="#doc-editor" hx-swap="outerHTML"
      hx-on::after-request="this.reset()">
  <input type="text" name="key" placeholder="New doc key (e.g. architecture)" required>
  <button class="primary" type="submit">Create</button>
</form>
<div id="doc-editor"></div>
{% endblock %}
