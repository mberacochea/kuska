<div id="tasks-container">
  <div class="task-header-row">
    <button type="button" id="reload-tasks-btn" class="reload-tasks-btn" aria-label="Reload task table">
      ↻ Reload
    </button>
  </div>

  <!-- Task Filters -->
  <div class="task-filters" id="task-filters-container">
    <input type="text" id="task-search" placeholder="Search tasks..." class="task-search"
           aria-label="Search tasks by title or description">

    <div class="filter-group">
      <label for="task-status">Status:</label>
      <select id="task-status" multiple class="task-filter-select" aria-label="Filter by status">
        {% for s in statuses %}
        <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="filter-group">
      <label for="task-agent">Agent:</label>
      <select id="task-agent" multiple class="task-filter-select" aria-label="Filter by assigned agent">
        <option value="">Unassigned</option>
        {% for a in agents %}
        <option value="{{ a.name }}">{{ a.name }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="button" class="filter-reset" id="filter-reset-btn" aria-label="Clear all filters">Reset</button>
  </div>

  {{ tasks_table|safe }}
</div>

<script>
function getFilterParams() {
  const params = new URLSearchParams();

  const search = document.getElementById('task-search').value.trim();
  if (search) {
    params.append('search', search);
  }

  const statusSelect = document.getElementById('task-status');
  for (const option of statusSelect.selectedOptions) {
    params.append('status', option.value);
  }

  const agentSelect = document.getElementById('task-agent');
  for (const option of agentSelect.selectedOptions) {
    params.append('agent', option.value);
  }

  return params;
}

function triggerFilter() {
  const params = getFilterParams();
  const url = '/tasks/filtered' + (params.toString() ? '?' + params.toString() : '');

  // Update URL without page reload to preserve filter state
  window.history.replaceState({}, '', url === '/tasks/filtered' ? window.location.pathname : url);

  // Fetch and update the task table
  htmx.ajax('GET', url, {target: '#tasks', swap: 'outerHTML'});
}

function resetFilters() {
  document.getElementById('task-search').value = '';
  document.getElementById('task-status').selectedIndex = -1;
  document.getElementById('task-agent').selectedIndex = -1;

  // Reset URL to base path
  window.history.replaceState({}, '', window.location.pathname);

  htmx.ajax('GET', '/tasks/filtered', {target: '#tasks', swap: 'outerHTML'});
}

function restoreFiltersFromURL() {
  const params = new URLSearchParams(window.location.search);

  // Restore search input
  const search = params.get('search');
  if (search) {
    document.getElementById('task-search').value = search;
  }

  // Restore status filters
  const statuses = params.getAll('status');
  if (statuses.length > 0) {
    const statusSelect = document.getElementById('task-status');
    for (const option of statusSelect.options) {
      option.selected = statuses.includes(option.value);
    }
  }

  // Restore agent filters
  const agents = params.getAll('agent');
  if (agents.length > 0) {
    const agentSelect = document.getElementById('task-agent');
    for (const option of agentSelect.options) {
      option.selected = agents.includes(option.value);
    }
  }
}

// Initialize: restore filters from URL and focus search input
document.addEventListener('DOMContentLoaded', function() {
  restoreFiltersFromURL();
  const searchInput = document.getElementById('task-search');
  if (searchInput) {
    searchInput.focus();
  }
});

// Setup event listeners for filters
document.getElementById('task-search')?.addEventListener('keyup', function(e) {
  // Debounce: only trigger after 300ms without typing
  clearTimeout(this.debounceTimer);
  this.debounceTimer = setTimeout(() => triggerFilter(), 300);
});

document.getElementById('task-status')?.addEventListener('change', triggerFilter);
document.getElementById('task-agent')?.addEventListener('change', triggerFilter);
document.getElementById('filter-reset-btn')?.addEventListener('click', resetFilters);

// Setup reload button listener
document.getElementById('reload-tasks-btn')?.addEventListener('click', function() {
  const params = getFilterParams();
  const url = '/tasks/filtered' + (params.toString() ? '?' + params.toString() : '');
  htmx.ajax('GET', url, {target: '#tasks', swap: 'outerHTML'});
});

// Keyboard accessibility: Escape clears search
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.activeElement?.id === 'task-search') {
    const searchInput = document.getElementById('task-search');
    if (searchInput.value) {
      searchInput.value = '';
      triggerFilter();
    }
  }
});
</script>
