{% extends "layout.html" %}
{% block body %}
<h2>Data <span class="muted">- every table, read-only</span></h2>
<nav style="margin-bottom:.8rem">
{% for name, t in tables.items() %}
  <a href="/data/{{ name }}" class="{{ 'on' if name == table }}">{{ t.label }}</a>
{% endfor %}
</nav>
{% if note %}<div class="muted small" style="margin-bottom:.6rem">{{ note }}</div>{% endif %}
{% if table %}
{{ rows|safe }}
{% endif %}
{% endblock %}
