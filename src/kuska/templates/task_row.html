<tr id="task-{{ t.id }}">
  <td class="num muted">{{ t.id }}</td>
  <td><a href="/tasks/{{ t.id }}">{{ t.title }}</a></td>
  <td>
    <select name="assigned_to" hx-post="/tasks/{{ t.id }}" hx-target="#task-{{ t.id }}" hx-swap="outerHTML">
      <option value="">unassigned</option>
      {% for a in agents %}<option value="{{ a.name }}" {{ 'selected' if a.name == t.assigned_to }}>{{ a.name }}</option>{% endfor %}
    </select>
  </td>
  <td>
    <select name="status" class="s s-{{ t.status }}" hx-post="/tasks/{{ t.id }}"
            hx-target="#task-{{ t.id }}" hx-swap="outerHTML">
      {% for s in statuses %}<option value="{{ s }}" {{ 'selected' if s == t.status }}>{{ s }}</option>{% endfor %}
    </select>
  </td>
  <td class="tags-cell">
    <div class="tags-display" id="tags-display-{{ t.id }}" style="display:flex; gap:.3rem; flex-wrap:wrap; align-items:center; min-height:1.5rem;">
      {% if t.tags %}
        {% for tag in t.tags.split(',') %}
          <span class="chip small">{{ tag }}</span>
        {% endfor %}
      {% else %}<span class="muted small">-</span>{% endif %}
      <button type="button" class="link small" onclick="editTags({{ t.id }})" style="margin-left:auto; flex-shrink:0;">edit</button>
    </div>
    <input type="text" id="tags-input-{{ t.id }}" name="tags"
           value="{{ t.tags or '' }}"
           placeholder="Comma-separated tags"
           style="display:none; width:100%;"
           hx-post="/tasks/{{ t.id }}"
           hx-target="#task-{{ t.id }}"
           hx-swap="outerHTML"
           hx-trigger="blur,keyup[key=='Enter']"
           onkeydown="if(event.key==='Escape') cancelEditTags({{ t.id }})">
  </td>
  <td class="small">
    {% for d in blocking.get(t.id, []) %}
      <span class="chip s-{{ d.status }}" title="{{ d.title }}">#{{ d.id }} {{ d.status }}</span>
    {% else %}<span class="muted">-</span>{% endfor %}
  </td>
  <td class="muted small" title="Created {{ t.created_at }}">{{ ago(t.created_at) }}</td>
  <td class="muted small" title="Updated {{ t.updated_at }}">{{ ago(t.updated_at) }}</td>
  <td><button class="link" hx-post="/tasks/{{ t.id }}/delete" hx-target="#tasks-container" hx-swap="outerHTML"
              hx-confirm="Delete task {{ t.id }}?">delete</button></td>
</tr>
