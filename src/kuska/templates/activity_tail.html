<div class="activity-container">
  <div class="activity-filters">
    <form class="activity-filter-controls" hx-get="/agents" hx-target="#activity" hx-trigger="change" hx-swap="outerHTML">
      <div class="filter-group">
        <label for="agent-filter">Agent</label>
        <select id="agent-filter" name="agent" class="activity-filter-select">
          <option value="">All agents</option>
          {% for a in agents %}
            <option value="{{ a.name }}"{% if agent_filter == a.name %} selected{% endif %}>{{ a.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <label for="kind-filter">Kind</label>
        <select id="kind-filter" name="kind" class="activity-filter-select">
          <option value="">All kinds</option>
          {% for k in kinds %}
            <option value="{{ k }}"{% if kind_filter == k %} selected{% endif %}>{{ k }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <label for="show-system">
          <input type="checkbox" id="show-system" name="system" value="1"{% if show_system %} checked{% endif %}>
          Show system events
        </label>
      </div>
    </form>
  </div>

  {% include "activity_log.html" %}
</div>
