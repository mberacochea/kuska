<div id="markdown-modal" class="modal-overlay open" onclick="if(event.target.id === 'markdown-modal') closePanel('markdown-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ table }} - {{ field }}</h3>
      <button class="modal-close" onclick="closePanel('markdown-modal')">×</button>
    </div>
    <div class="modal-content">
      <div class="md">{{ md(content)|safe }}</div>
    </div>
  </div>
</div>
