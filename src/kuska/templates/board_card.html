{# one Kanban card; `picker` shows the inline agent chooser under the card #}
<div class="kcard{{ ' kcard-fixed' if t.status == 'in_progress' }}" id="card-{{ t.id }}"
     data-id="{{ t.id }}" data-status="{{ t.status }}"
     {% if t.status != 'in_progress' %}draggable="true"{% endif %}>
  <div class="kcard-head">
    <span class="num muted">#{{ t.id }}</span>
    {% if show_status %}<span class="chip small s-{{ t.status }}">{{ t.status }}</span>{% endif %}
  </div>
  <a class="kcard-title" href="/tasks/{{ t.id }}">{{ t.title }}</a>
  <div class="kcard-agent small muted">{{ t.assigned_to or 'unassigned' }}{% if t.feature %} · <span class="chip small">{{ t.feature }}</span>{% endif %}</div>
  {% if picker %}
  <form class="kcard-pick small" hx-post="/tasks/{{ t.id }}/move" hx-target="#board" hx-swap="outerHTML"
        hx-include="#task-filters-container">
    <input type="hidden" name="column" value="ready">
    <select name="assigned_to" required hx-post="/tasks/{{ t.id }}/move" hx-trigger="change"
            hx-target="#board" hx-swap="outerHTML" hx-include="closest form, #task-filters-container">
      <option value="">choose an agent...</option>
      {% for a in agents %}<option value="{{ a.name }}">{{ a.name }}</option>{% endfor %}
    </select>
    <button type="button" class="link small" hx-get="/board" hx-include="#task-filters-container" hx-target="#board" hx-swap="outerHTML">cancel</button>
  </form>
  {% endif %}
</div>
