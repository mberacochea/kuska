{% extends "layout.html" %}
{% block body %}
<h2>Description</h2>
<form hx-post="/description" hx-target="#toast" hx-swap="innerHTML">
  <textarea name="content" hx-post="/description" hx-trigger="blur"
            hx-target="#toast" hx-swap="innerHTML"
            placeholder="What this project is, and what the agents should know about it. Markdown.">{{ description }}</textarea>
</form>
{% if description %}
<details class="card" style="margin-top:.6rem">
  <summary class="muted small">rendered</summary>
  <div class="md">{{ description_html|safe }}</div>
</details>
{% endif %}

<h2>Export</h2>
<button hx-post="/export" hx-target="#toast" hx-swap="innerHTML">Export markdown</button>
<span class="muted small">writes .agents-export/</span>
{% endblock %}
