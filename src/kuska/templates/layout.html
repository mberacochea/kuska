<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ project_name }} - kuska</title>
{# htmx drops 4xx bodies by default. Swap 422 (a refused form; its toast carries the message) and keep every other 4xx/5xx an error. #}
<meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true,"error":false},{"code":"[45]..","swap":false,"error":true},{"code":"...","swap":true}]}'>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header>
  <h1>{{ project_name }}</h1>
  <nav>
    <a href="/" class="{{ 'on' if page == 'project' }}">Project</a>
    <a href="/tasks" class="{{ 'on' if page == 'tasks' }}">Tasks</a>
    <a href="/board" class="{{ 'on' if page == 'board' }}">Board</a>
    <a href="/agents"class="{{ 'on' if page == 'agents' }}">Agents</a>
    <a href="/runs" class="{{ 'on' if page == 'runs' }}">Runs</a>
    <a href="/merge-queue" class="{{ 'on' if page == 'merge-queue' }}">Merge Queue</a>
    <a href="/docs" class="{{ 'on' if page == 'docs' }}">Docs</a>
    <a href="/search" class="{{ 'on' if page == 'search' }}">Search</a>
    <a href="/stats" class="{{ 'on' if page == 'stats' }}">Stats</a>
    <a href="/data" class="{{ 'on' if page == 'data' }}">Data</a>
  </nav>
  {% if projects|length > 1 %}
  <form method="post" action="/switch" style="margin-left:auto">
    <select name="project" onchange="this.form.submit()">
      {% for name in projects %}<option value="{{ name }}" {{ 'selected' if name == project_name }}>{{ name }}</option>{% endfor %}
    </select>
  </form>
  {% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
<div id="toast"></div>
</body>
</html>
