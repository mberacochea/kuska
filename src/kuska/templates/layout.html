<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ project_name }} - kuska</title>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header>
  <h1>{{ project_name }}</h1>
  <nav>
    <a href="/tasks" class="{{ 'on' if page == 'tasks' }}">Tasks</a>
    <a href="/" class="{{ 'on' if page == 'project' }}">Project</a>
    <a href="/agents" class="{{ 'on' if page == 'agents' }}">Agents</a>
    <a href="/docs" class="{{ 'on' if page == 'docs' }}">Docs</a>
    <a href="/search" class="{{ 'on' if page == 'search' }}">Search</a>
    <a href="/stats" class="{{ 'on' if page == 'stats' }}">Stats</a>
    <a href="/data" class="{{ 'on' if page == 'data' }}">Data</a>
  </nav>
  {% if projects|length > 1 %}
  <form hx-post="/switch" hx-target="body" hx-swap="innerHTML" style="margin-left:auto">
    <select name="project" onchange="this.form.requestSubmit()">
      {% for name in projects %}<option value="{{ name }}" {{ 'selected' if name == project_name }}>{{ name }}</option>{% endfor %}
    </select>
  </form>
  {% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
<div id="toast"></div>

<script>
// Prevent re-initialization of task filter on HTMX swaps
let currentSort = { field: null, direction: 'asc' };

if (!window.kuskaTaskFiltersInitialized) {
  window.kuskaTaskFiltersInitialized = true;

  function getFilterParams() {
    const params = new URLSearchParams();

    const search = document.getElementById('task-search')?.value.trim();
    if (search) {
      params.append('search', search);
    }

    const statusSelect = document.getElementById('task-status');
    if (statusSelect) {
      for (const option of statusSelect.selectedOptions) {
        params.append('status', option.value);
      }
    }

    const agentSelect = document.getElementById('task-agent');
    if (agentSelect) {
      for (const option of agentSelect.selectedOptions) {
        params.append('agent', option.value);
      }
    }

    // Preserve sort state
    if (currentSort.field) {
      params.append('sort', currentSort.field);
      params.append('direction', currentSort.direction);
    }

    return params;
  }

  function triggerFilter() {
    const params = getFilterParams();
    const url = '/tasks/filtered' + (params.toString() ? '?' + params.toString() : '');

    // Update URL without page reload to preserve filter state
    window.history.replaceState({}, '', url === '/tasks/filtered' ? window.location.pathname : url);

    // Fetch and update the task table
    htmx.ajax('GET', url, {target: '#tasks', swap: 'outerHTML'});
  }

  function resetFilters() {
    const searchEl = document.getElementById('task-search');
    if (searchEl) searchEl.value = '';

    const statusEl = document.getElementById('task-status');
    if (statusEl) statusEl.selectedIndex = -1;

    const agentEl = document.getElementById('task-agent');
    if (agentEl) agentEl.selectedIndex = -1;

    // Reset URL to base path
    window.history.replaceState({}, '', window.location.pathname);

    htmx.ajax('GET', '/tasks/filtered', {target: '#tasks', swap: 'outerHTML'});
  }

  function restoreFiltersFromURL() {
    const params = new URLSearchParams(window.location.search);

    // Restore search input
    const search = params.get('search');
    if (search) {
      const searchEl = document.getElementById('task-search');
      if (searchEl) searchEl.value = search;
    }

    // Restore status filters
    const statuses = params.getAll('status');
    if (statuses.length > 0) {
      const statusSelect = document.getElementById('task-status');
      if (statusSelect) {
        for (const option of statusSelect.options) {
          option.selected = statuses.includes(option.value);
        }
      }
    }

    // Restore agent filters
    const agents = params.getAll('agent');
    if (agents.length > 0) {
      const agentSelect = document.getElementById('task-agent');
      if (agentSelect) {
        for (const option of agentSelect.options) {
          option.selected = agents.includes(option.value);
        }
      }
    }

    // Restore sort state
    const sortField = params.get('sort');
    const sortDirection = params.get('direction');
    if (sortField) {
      currentSort.field = sortField;
      currentSort.direction = sortDirection || 'asc';
    }
  }

  // Initialize: restore filters from URL and focus search input
  document.addEventListener('DOMContentLoaded', function() {
    restoreFiltersFromURL();
    const searchInput = document.getElementById('task-search');
    if (searchInput) {
      searchInput.focus();
    }
  });

  // Setup event listeners for filters
  document.addEventListener('DOMContentLoaded', function() {
    const searchEl = document.getElementById('task-search');
    if (searchEl) {
      searchEl.addEventListener('keyup', function(e) {
        // Debounce: only trigger after 300ms without typing
        clearTimeout(this.debounceTimer);
        this.debounceTimer = setTimeout(() => triggerFilter(), 300);
      });
    }

    const statusEl = document.getElementById('task-status');
    if (statusEl) {
      statusEl.addEventListener('change', triggerFilter);
    }

    const agentEl = document.getElementById('task-agent');
    if (agentEl) {
      agentEl.addEventListener('change', triggerFilter);
    }

    const resetBtn = document.getElementById('filter-reset-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', resetFilters);
    }

    // Setup reload button listener
    const reloadBtn = document.getElementById('reload-tasks-btn');
    if (reloadBtn) {
      reloadBtn.addEventListener('click', function() {
        const params = getFilterParams();
        const url = '/tasks/filtered' + (params.toString() ? '?' + params.toString() : '');
        htmx.ajax('GET', url, {target: '#tasks', swap: 'outerHTML'});
      });
    }
  });

  // Keyboard accessibility: Escape clears search
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.activeElement?.id === 'task-search') {
      const searchInput = document.getElementById('task-search');
      if (searchInput && searchInput.value) {
        searchInput.value = '';
        triggerFilter();
      }
    }
  });
}

// Handle form validation errors
document.body.addEventListener('htmx:afterSwap', function(event) {
  // Find any error messages in the swapped content
  const errorMessages = event.detail.xhr.responseText.match(/<div class="field-error"[^>]*data-field="([^"]*)"[^>]*>([^<]*)<\/div>/g);

  if (errorMessages && event.detail.xhr.status === 422) {
    // Parse errors and apply to fields
    const errors = {};
    errorMessages.forEach(msg => {
      const fieldMatch = msg.match(/data-field="([^"]*)"/);
      const textMatch = msg.match(/>([^<]*)<\/div>/);
      if (fieldMatch && textMatch) {
        errors[fieldMatch[1]] = textMatch[1];
      }
    });

    // Find form and apply error styling
    const swappedElement = event.detail.xhr.responseXML ?
      event.detail.xhr.responseXML.body.firstElementChild :
      document.querySelector('[id="' + event.detail.target.id + '"]');

    if (swappedElement) {
      const form = swappedElement.closest('form');
      if (form) {
        // Clear previous errors
        form.querySelectorAll('input.has-error, textarea.has-error, select.has-error')
          .forEach(el => el.classList.remove('has-error'));

        // Apply new errors
        Object.entries(errors).forEach(([field, message]) => {
          const input = form.querySelector('[name="' + field + '"]');
          if (input) {
            input.classList.add('has-error');
            input.setAttribute('aria-invalid', 'true');
          }
        });
      }
    }
  }
});

// Clear error styling when user starts editing
document.body.addEventListener('input', function(event) {
  if (event.target.classList.contains('has-error')) {
    event.target.classList.remove('has-error');
    event.target.setAttribute('aria-invalid', 'false');
  }
});
</script>
</body>
</html>
