<div id="agent-rows" hx-get="/agents" hx-trigger="every 5s" hx-swap="outerHTML">
<table>
<thead><tr><th>Name</th><th>Backend</th><th>Model</th><th>Role</th><th>Status</th><th>Heartbeat</th></tr></thead>
<tbody>
{% for a in agents %}
<tr>
  <td><a href="/agents/{{ a.name }}">{{ a.name }}</a></td>
  <td>{{ a.backend }}</td>
  <td>{{ models.get(a.name) or '-' }}</td>
  <td>{{ a.role }}</td>
  <td><span class="dot {{ a.status }}"></span>{{ a.status }}{% if a.running > 1 %} ×{{ a.running }}{% endif %}</td>
  <td class="muted small">{{ ago(a.last_heartbeat) }}</td>
</tr>
{% else %}
<tr><td colspan="6" class="muted">No agents yet - add one below.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
