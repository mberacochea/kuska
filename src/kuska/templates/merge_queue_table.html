{# Merge queue table #}
<table id="merge-queue" style="width:100%"
       hx-trigger="every 5s" hx-get="/merge-queue" hx-swap="outerHTML">
<thead><tr>
  <th class="num">#</th>
  <th>Title</th>
  <th>Agent</th>
  <th>Branch</th>
  <th class="num">Ahead</th>
  <th>Diff</th>
  <th class="num">Blocks</th>
  <th>Review</th>
  <th>Merged?</th>
  <th>Actions</th>
</tr></thead>
<tbody>
{% include "merge_queue_rows.html" %}
{% if not tasks %}<tr><td colspan="10" class="muted">No tasks ready to merge.</td></tr>{% endif %}
</tbody>
</table>
