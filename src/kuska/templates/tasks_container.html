<div id="tasks-container">
  <form id="task-filters-container" class="task-filters"
        hx-get="/tasks" hx-target="#tasks-container" hx-swap="outerHTML" hx-push-url="true"
        hx-trigger="change from:select, input changed delay:400ms from:input"
        hx-include="#task-filters-container">
    <input type="hidden" name="sort" value="{{ sort_by }}">
    <input type="hidden" name="direction" value="{{ sort_dir }}">

    {# hx-preserve keeps this exact input node (focus, cursor position) across
       the outerHTML swap below - without it, every debounced search request
       replaces the field out from under you, which is what actually reads as
       "flicker" while typing, not the request rate itself. #}
    <input type="text" id="task-search-input" name="search" placeholder="Search tasks..." class="task-search"
           aria-label="Search tasks by title or description" value="{{ search }}" autofocus
           hx-preserve="true">

    <div class="filter-group">
      <label for="task-status">Status:</label>
      <select id="task-status" name="status" multiple class="task-filter-select" aria-label="Filter by status">
        {% for s in statuses %}
        <option value="{{ s }}" {{ 'selected' if s in status_list }}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="filter-group">
      <label for="task-agent">Agent:</label>
      <select id="task-agent" name="agent" multiple class="task-filter-select" aria-label="Filter by assigned agent">
        <option value="" {{ 'selected' if '' in agent_list }}>Unassigned</option>
        {% for a in agents %}
        <option value="{{ a.name }}" {{ 'selected' if a.name in agent_list }}>{{ a.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="filter-group">
      <label for="task-tags">Tags:</label>
      <select id="task-tags" name="tag" multiple class="task-filter-select" aria-label="Filter by tags">
        <option value="" {{ 'selected' if '' in tag_list }}>Untagged</option>
        {% for t in tags %}
        <option value="{{ t }}" {{ 'selected' if t in tag_list }}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="button" class="filter-reset" aria-label="Clear all filters"
            hx-get="/tasks" hx-target="#tasks-container" hx-swap="outerHTML" hx-push-url="true"
            hx-params="none">Reset</button>
  </form>

  <div class="task-header-row">
    <button type="button" class="reload-tasks-btn" aria-label="Reload task table"
            hx-get="/tasks" hx-target="#tasks-container" hx-swap="outerHTML" hx-push-url="true"
            hx-include="#task-filters-container">
      ↻ Reload
    </button>
  </div>

  {{ tasks_table|safe }}
</div>
