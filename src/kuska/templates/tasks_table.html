<table id="tasks">
<thead><tr>
  <th class="num">#</th>
  <th><a href="#" class="sort-header" data-sort="title">Title</a></th>
  <th><a href="#" class="sort-header" data-sort="assigned_to">Assigned</a></th>
  <th><a href="#" class="sort-header" data-sort="status">Status</a></th>
  <th>Waiting on</th>
  <th><a href="#" class="sort-header" data-sort="created_at">Created</a></th>
  <th><a href="#" class="sort-header" data-sort="updated_at">Updated</a></th>
  <th></th>
</tr></thead>
<tbody>
{% for t in tasks %}{{ render_row(t)|safe }}{% endfor %}
{% if not tasks %}<tr><td colspan="8" class="muted">No tasks yet.</td></tr>{% endif %}
</tbody>
</table>

<script>
// Sorting functionality - uses currentSort and getFilterParams from layout.html

function applySorting(field) {
  // Toggle direction if clicking the same field
  if (currentSort.field === field) {
    currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort.field = field;
    currentSort.direction = 'asc';
  }

  const params = getFilterParams();
  const url = '/tasks/filtered' + (params.toString() ? '?' + params.toString() : '');

  // Update URL without reload
  window.history.replaceState({}, '', url);

  // Fetch and update the task table
  htmx.ajax('GET', url, {target: '#tasks', swap: 'outerHTML'});
}

// Setup sort header click handlers - add event listeners after a brief delay to ensure tasks_container is loaded
setTimeout(function() {
  document.querySelectorAll('.sort-header').forEach(header => {
    header.addEventListener('click', function(e) {
      e.preventDefault();
      const field = this.getAttribute('data-sort');
      applySorting(field);
    });
  });
}, 100);
</script>
