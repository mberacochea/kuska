# agent registry for this project
# one [agents.<name>] table per agent; the prompt lives in .agents/prompts/<name>.md
#
# Three flavors ship by default - dev, reviewer and planner - each seeded
# from its own prompt template (defaults/prompt_<flavor>.md). planning-agent
# breaks goals into tasks, dev-agent implements them, review-agent checks the
# result before a human looks at it. Delete any of them you don't want, or
# add more agents with the same flavor for parallel capacity.

# Per-run limits, any agent: max_turns, max_budget_usd, timeout_minutes.
# Hitting one blocks the task with a note saying which. Unset means no limit,
# except the timeout, which defaults to 60 minutes.

[agents.planning-agent]
backend = "claude"
model = "claude-opus-5"
role = "Breaks goals into tasks for dev-agent and review-agent"
flavor = "planner"

[agents.dev-agent]
backend = "claude"
model = "claude-opus-5"
role = "Implements features and fixes bugs"
flavor = "dev"

[agents.review-agent]
backend = "claude"
model = "claude-opus-5"
role = "Reviews dev-agent's changes before they merge"
flavor = "reviewer"

